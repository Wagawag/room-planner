<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תכנן את החדר שלך</title>
<style>
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f0f2f5; direction:rtl; }
.header { text-align:center; padding:16px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.08); }
h1 { margin:0 0 6px; font-size:22px; }
.controls { display:flex; gap:12px; justify-content:center; margin-top:10px; flex-wrap:wrap; }
.controls label { font-size:14px; }
.controls input { width:70px; padding:8px; border:1px solid #ddd; border-radius:6px; text-align:center; }
.room-container { display:flex; flex-direction:column; gap:16px; padding:16px; max-width:600px; margin:0 auto; }
.catalog { background:#fff; border-radius:12px; padding:14px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.catalog-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.item { background:#f8f9fa; border-radius:10px; padding:10px; text-align:center; }
.item img { width:100%; height:90px; object-fit:cover; border-radius:8px; }
.item p { margin:6px 0 2px; font-size:14px; font-weight:600; }
.item small { color:#666; font-size:12px; }
.add-btn { display:block; width:100%; background:#00b67a; color:#fff; border:none; padding:8px; border-radius:6px; margin-top:8px; font-size:14px; font-weight:700; cursor:pointer; }
.room { background:#f5f0eb; border-radius:12px; min-height:420px; position:relative; box-shadow:0 2px 12px rgba(0,0,0,.1); border:2px solid #e0d6cc; }
.furniture { position:absolute; text-align:center; cursor:move; touch-action:none; z-index:2; }
.furniture img { width:100px; border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,.25); background:#fff; }
.furniture .label { background:rgba(255,255,255,.95); padding:3px 6px; border-radius:4px; font-size:11px; margin-top:3px; display:inline-block; }
.dimensions { position:absolute; top:12px; left:12px; background:rgba(255,255,255,.9); padding:8px 14px; border-radius:8px; font-size:14px; font-weight:600; z-index:3; }
.warning { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#ff4444; color:#fff; padding:12px 20px; border-radius:8px; display:none; z-index:10; }
.view3d-btn { display:block; width:100%; background:#0066cc; color:#fff; border:none; padding:14px; border-radius:10px; font-size:16px; font-weight:700; margin-top:10px; cursor:pointer; }
#view3d { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#1a1a1a; z-index:100; }
.close3d { position:absolute; top:16px; right:16px; background:#fff; border:none; padding:10px 16px; border-radius:8px; font-weight:700; cursor:pointer; z-index:101; }
.hint { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); color:#fff; font-size:14px; background:rgba(0,0,0,.5); padding:8px 16px; border-radius:20px; }
</style>
</head>
<body>
<div class="header">
  <h1>תכנן את החדר שלך</h1>
  <p>לחץ על "הוסף לחדר" ואז הזז את הרהיט</p>
  <div class="controls">
    <label>רוחב (מ'): <input type="number" id="width" value="4" min="2" max="15" step="0.1"></label>
    <label>אורך (מ'): <input type="number" id="length" value="5" min="2" max="15" step="0.1"></label>
    <label>גובה (מ'): <input type="number" id="height" value="2.6" min="2" max="4" step="0.1"></label>
  </div>
</div>

<div class="room-container">
  <div class="catalog">
    <h3>רהיטים</h3>
    <div class="catalog-grid">
      <div class="item">
        <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=300&h=200&fit=crop" alt="ספה">
        <p>ספה</p>
        <small>220×90×85 ס"מ</small>
        <button class="add-btn" onclick="addFurniture('ספה', 2.2, 0.9, 0.85, 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=400&h=300&fit=crop')">הוסף לחדר</button>
      </div>
      <div class="item">
        <img src="https://images.unsplash.com/photo-1533090481720-856c6e3c1fdc?w=300&h=200&fit=crop" alt="שולחן">
        <p>שולחן קפה</p>
        <small>100×60×40 ס"מ</small>
        <button class="add-btn" onclick="addFurniture('שולחן קפה', 1.0, 0.6, 0.4, 'https://images.unsplash.com/photo-1533090481720-856c6e3c1fdc?w=400&h=300&fit=crop')">הוסף לחדר</button>
      </div>
      <div class="item">
        <img src="https://images.unsplash.com/photo-1506439773649-6e0eb8cfb237?w=300&h=200&fit=crop" alt="כיסא">
        <p>כיסא</p>
        <small>50×50×90 ס"מ</small>
        <button class="add-btn" onclick="addFurniture('כיסא', 0.5, 0.5, 0.9, 'https://images.unsplash.com/photo-1506439773649-6e0eb8cfb237?w=400&h=300&fit=crop')">הוסף לחדר</button>
      </div>
      <div class="item">
        <img src="https://images.unsplash.com/photo-1594620302200-9a762244a156?w=300&h=200&fit=crop" alt="מדף">
        <p>מדף</p>
        <small>120×30×40 ס"מ</small>
        <button class="add-btn" onclick="addFurniture('מדף', 1.2, 0.3, 0.4, 'https://images.unsplash.com/photo-1594620302200-9a762244a156?w=400&h=300&fit=crop')">הוסף לחדר</button>
      </div>
    </div>
  </div>

  <div class="room" id="room">
    <div class="dimensions" id="dimLabel">חדר: 4×5×2.6 מטר</div>
    <div class="warning" id="warning">הרהיט לא נכנס לחדר!</div>
  </div>

  <button class="view3d-btn" onclick="open3D()">צפה בתלת-מימד</button>
</div>

<div id="view3d">
  <button class="close3d" onclick="close3D()">סגור</button>
  <canvas id="canvas3d"></canvas>
  <div class="hint">גרור כדי לסובב</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const room = document.getElementById('room');
const widthInput = document.getElementById('width');
const lengthInput = document.getElementById('length');
const heightInput = document.getElementById('height');
const dimLabel = document.getElementById('dimLabel');
const warning = document.getElementById('warning');
const view3dDiv = document.getElementById('view3d');

function updateDimensions() {
  dimLabel.textContent = `חדר: ${widthInput.value}×${lengthInput.value}×${heightInput.value} מטר`;
}
[widthInput, lengthInput, heightInput].forEach(el => el.addEventListener('input', updateDimensions));

function addFurniture(name, w, d, h, imgSrc) {
  const roomW = parseFloat(widthInput.value);
  const roomL = parseFloat(lengthInput.value);
  const roomH = parseFloat(heightInput.value);

  if (w > roomW || d > roomL || h > roomH) {
    warning.style.display = 'block';
    setTimeout(() => warning.style.display = 'none', 2000);
    return;
  }

  const furniture = document.createElement('div');
  furniture.className = 'furniture';
  furniture.dataset.img = imgSrc;
  furniture.style.left = '50px';
  furniture.style.top = '120px';
  furniture.innerHTML = `
    <img src="${imgSrc}">
    <div class="label">${name}<br>${(w*100).toFixed(0)}×${(d*100).toFixed(0)}×${(h*100).toFixed(0)} ס"מ</div>
  `;

  let isDragging = false, offsetX, offsetY;

  function startDrag(e) {
    isDragging = true;
    const rect = furniture.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    offsetX = clientX - rect.left;
    offsetY = clientY - rect.top;
    e.preventDefault();
  }

  function drag(e) {
    if (!isDragging) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const roomRect = room.getBoundingClientRect();
    let newLeft = clientX - roomRect.left - offsetX;
    let newTop = clientY - roomRect.top - offsetY;
    newLeft = Math.max(0, Math.min(newLeft, roomRect.width - 100));
    newTop = Math.max(0, Math.min(newTop, roomRect.height - 100));
    furniture.style.left = newLeft + 'px';
    furniture.style.top = newTop + 'px';
    e.preventDefault();
  }

  function stopDrag() {
    isDragging = false;
  }

  furniture.addEventListener('mousedown', startDrag);
  furniture.addEventListener('touchstart', startDrag, {passive: false});
  document.addEventListener('mousemove', drag);
  document.addEventListener('touchmove', drag, {passive: false});
  document.addEventListener('mouseup', stopDrag);
  document.addEventListener('touchend', stopDrag);

  room.appendChild(furniture);
  room.scrollIntoView({behavior:'smooth', block:'center'});
}

let renderer, scene, camera, isRotating = false, prevX = 0;

function open3D() {
  view3dDiv.style.display = 'block';
  init3D();
}

function close3D() {
  view3dDiv.style.display = 'none';
  if (renderer) renderer.dispose();
}

function init3D() {
  const canvas = document.getElementById('canvas3d');
  renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2a2a2a);

  const roomW = parseFloat(widthInput.value);
  const roomL = parseFloat(lengthInput.value);
  const roomH = parseFloat(heightInput.value);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(roomW * 0.7, roomH * 1.1, roomL * 0.7);
  camera.lookAt(0, roomH * 0.3, 0);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight.position.set(5, 10, 5);
  scene.add(dirLight);

  // Floor
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(roomW, roomL),
    new THREE.MeshStandardMaterial({color: 0xe8e0d5})
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  // Walls
  const wallMat = new THREE.MeshStandardMaterial({color: 0xf5f0eb, side: THREE.DoubleSide});
  const wallBack = new THREE.Mesh(new THREE.PlaneGeometry(roomW, roomH), wallMat);
  wallBack.position.set(0, roomH/2, -roomL/2);
  scene.add(wallBack);
  const wallLeft = new THREE.Mesh(new THREE.PlaneGeometry(roomL, roomH), wallMat);
  wallLeft.position.set(-roomW/2, roomH/2, 0);
  wallLeft.rotation.y = Math.PI / 2;
  scene.add(wallLeft);

  // Furniture as textured planes
  const loader = new THREE.TextureLoader();
  const furnitures = document.querySelectorAll('.furniture');
  furnitures.forEach((el, i) => {
    const imgSrc = el.dataset.img;
    loader.load(imgSrc, (texture) => {
      const plane = new THREE.Mesh(
        new THREE.PlaneGeometry(1.2, 0.9),
        new THREE.MeshBasicMaterial({map: texture, transparent: true})
      );
      const x = ((i % 3) - 1) * 1.4;
      const z = (Math.floor(i / 3) - 0.5) * 1.6;
      plane.position.set(x, 0.45, z);
      scene.add(plane);
    });
  });

  // Rotation controls
  canvas.addEventListener('mousedown', (e) => { isRotating = true; prevX = e.clientX; });
  canvas.addEventListener('touchstart', (e) => { isRotating = true; prevX = e.touches[0].clientX; }, {passive:true});
  canvas.addEventListener('mousemove', (e) => {
    if (!isRotating) return;
    const delta = (e.clientX - prevX) * 0.01;
    camera.position.x = Math.cos(delta) * camera.position.x - Math.sin(delta) * camera.position.z;
    camera.position.z = Math.sin(delta) * camera.position.x + Math.cos(delta) * camera.position.z;
    camera.lookAt(0, roomH * 0.3, 0);
    prevX = e.clientX;
  });
  canvas.addEventListener('touchmove', (e) => {
    if (!isRotating) return;
    const delta = (e.touches[0].clientX - prevX) * 0.01;
    camera.position.x = Math.cos(delta) * camera.position.x - Math.sin(delta) * camera.position.z;
    camera.position.z = Math.sin(delta) * camera.position.x + Math.cos(delta) * camera.position.z;
    camera.lookAt(0, roomH * 0.3, 0);
    prevX = e.touches[0].clientX;
  }, {passive:true});
  canvas.addEventListener('mouseup', () => isRotating = false);
  canvas.addEventListener('touchend', () => isRotating = false);

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();
}
</script>
</body>
</html>
