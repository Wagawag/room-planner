<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תכנן את החדר שלך</title>
<style>
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f5f5f5; direction:rtl; }
.header { text-align:center; padding:20px; background:#fff; }
h1 { margin:0 0 8px; font-size:22px; }
.room-container { display:flex; gap:16px; padding:16px; max-width:900px; margin:0 auto; }
.catalog { width:220px; background:#fff; border-radius:12px; padding:12px; }
.item { background:#f8f9fa; border-radius:8px; padding:10px; margin-bottom:10px; cursor:grab; text-align:center; }
.item img { width:100%; border-radius:6px; }
.item p { margin:6px 0 0; font-size:13px; }
.room { flex:1; background:#e8e8e8; border:2px dashed #ccc; border-radius:12px; min-height:500px; position:relative; background-image:linear-gradient(#ddd 1px, transparent 1px), linear-gradient(90deg, #ddd 1px, transparent 1px); background-size:40px 40px; }
.furniture { position:absolute; cursor:move; text-align:center; }
.furniture img { width:120px; border-radius:6px; }
.furniture span { display:block; font-size:12px; background:#fff; padding:2px 6px; border-radius:4px; margin-top:4px; }
.dimensions { position:absolute; top:10px; left:10px; background:#fff; padding:8px 12px; border-radius:8px; font-size:14px; }
</style>
</head>
<body>
<div class="header">
  <h1>תכנן את החדר שלך</h1>
  <p>גרור רהיטים לחדר וראה אם הם נכנסים</p>
</div>

<div class="room-container">
  <div class="catalog">
    <h3>רהיטים</h3>
    <div class="item" draggable="true" data-name="ספה" data-w="220" data-h="90">
      <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=200&h=150&fit=crop" alt="ספה">
      <p>ספה (220×90 ס"מ)</p>
    </div>
    <div class="item" draggable="true" data-name="שולחן קפה" data-w="100" data-h="60">
      <img src="https://images.unsplash.com/photo-1533090481720-856c6e3c1fdc?w=200&h=150&fit=crop" alt="שולחן">
      <p>שולחן קפה (100×60 ס"מ)</p>
    </div>
    <div class="item" draggable="true" data-name="כיסא" data-w="50" data-h="50">
      <img src="https://images.unsplash.com/photo-1506439773649-6e0eb8cfb237?w=200&h=150&fit=crop" alt="כיסא">
      <p>כיסא (50×50 ס"מ)</p>
    </div>
  </div>

  <div class="room" id="room">
    <div class="dimensions">חדר: 4×5 מטר</div>
  </div>
</div>

<script>
const room = document.getElementById('room');
let draggedItem = null;

document.querySelectorAll('.item').forEach(item => {
  item.addEventListener('dragstart', (e) => {
    draggedItem = item;
  });
});

room.addEventListener('dragover', (e) => e.preventDefault());

room.addEventListener('drop', (e) => {
  e.preventDefault();
  if (!draggedItem) return;

  const name = draggedItem.dataset.name;
  const w = draggedItem.dataset.w;
  const h = draggedItem.dataset.h;
  const imgSrc = draggedItem.querySelector('img').src;

  const furniture = document.createElement('div');
  furniture.className = 'furniture';
  furniture.style.left = (e.offsetX - 60) + 'px';
  furniture.style.top = (e.offsetY - 40) + 'px';
  furniture.innerHTML = `<img src="${imgSrc}"><span>${name}<br>${w}×${h} ס"מ</span>`;

  // Make it draggable inside the room
  furniture.draggable = true;
  furniture.addEventListener('dragstart', (ev) => {
    ev.dataTransfer.setData('text', '');
    furniture.style.opacity = '0.5';
  });
  furniture.addEventListener('dragend', (ev) => {
    furniture.style.left = (ev.pageX - room.getBoundingClientRect().left - 60) + 'px';
    furniture.style.top = (ev.pageY - room.getBoundingClientRect().top - 40) + 'px';
    furniture.style.opacity = '1';
  });

  room.appendChild(furniture);
});
</script>
</body>
</html>
