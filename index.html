<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">

<title>תכנן את החדר שלך</title>
<style>
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f0f2f5; direction:rtl; }
.header { text-align:center; padding:16px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.08); }
h1 { margin:0 0 6px; font-size:22px; }
.controls { display:flex; gap:12px; justify-content:center; margin-top:10px; }
.controls input { width:80px; padding:8px; border:1px solid #ddd; border-radius:6px; text-align:center; }
.room-container { display:flex; gap:16px; padding:16px; max-width:1000px; margin:0 auto; }
.catalog { width:240px; background:#fff; border-radius:12px; padding:14px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.item { background:#f8f9fa; border-radius:10px; padding:10px; margin-bottom:12px; cursor:grab; text-align:center; }
.item img { width:100%; height:110px; object-fit:cover; border-radius:8px; }
.item p { margin:8px 0 4px; font-size:14px; font-weight:600; }
.item small { color:#666; }
.buy { display:inline-block; background:#00b67a; color:#fff; text-decoration:none; font-size:12px; padding:4px 10px; border-radius:6px; margin-top:6px; }
.room { flex:1; background:#eaeaea url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=1200&h=800&fit=crop') center/cover; border-radius:12px; min-height:520px; position:relative; box-shadow:0 2px 12px rgba(0,0,0,.1); }
.furniture { position:absolute; cursor:move; text-align:center; }
.furniture img { width:130px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.2); }
.furniture .label { background:rgba(255,255,255,.95); padding:4px 8px; border-radius:6px; font-size:12px; margin-top:4px; display:inline-block; }
.dimensions { position:absolute; top:12px; left:12px; background:rgba(255,255,255,.9); padding:8px 14px; border-radius:8px; font-size:14px; font-weight:600; }
</style>
</head>
