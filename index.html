<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תכנן את החדר שלך</title>
<style>
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f0f2f5; direction:rtl; }
.header { text-align:center; padding:16px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.08); }
h1 { margin:0 0 6px; font-size:22px; }
.controls { display:flex; gap:12px; justify-content:center; margin-top:10px; flex-wrap:wrap; }
.controls label { font-size:14px; }
.controls input { width:70px; padding:8px; border:1px solid #ddd; border-radius:6px; text-align:center; }
.room-container { display:flex; flex-direction:column; gap:16px; padding:16px; max-width:600px; margin:0 auto; }
.catalog { background:#fff; border-radius:12px; padding:14px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.catalog-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.item { background:#f8f9fa; border-radius:10px; padding:10px; text-align:center; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
.item:active { background:#e0e0e0; }
.item img { width:100%; height:90px; object-fit:cover; border-radius:8px; pointer-events:none; }
.item p { margin:6px 0 2px; font-size:14px; font-weight:600; }
.item small { color:#666; font-size:12px; }
.room { background:#eaeaea url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=1200&h=800&fit=crop') center/cover; border-radius:12px; min-height:420px; position:relative; box-shadow:0 2px 12px rgba(0,0,0,.1); }
.furniture { position:absolute; cursor:move; text-align:center; touch-action:none; }
.furniture img { width:110px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.2); }
.furniture .label { background:rgba(255,255,255,.95); padding:4px 8px; border-radius:6px; font-size:12px; margin-top:4px; display:inline-block; }
.dimensions { position:absolute; top:12px; left:12px; background:rgba(255,255,255,.9); padding:8px 14px; border-radius:8px; font-size:14px; font-weight:600; }
.warning { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#ff4444; color:#fff; padding:12px 20px; border-radius:8px; display:none; z-index:10; }
.view3d-btn { display:block; width:100%; background:#0066cc; color:#fff; border:none; padding:14px; border-radius:10px; font-size:16px; font-weight:700; margin-top:10px; cursor:pointer; }
</style>
</head>
<body>
<div class="header">
  <h1>תכנן את החדר שלך</h1>
  <p>לחץ על רהיט כדי להוסיף אותו לחדר</p>
  <div class="controls">
    <label>רוחב (מ'): <input type="number" id="width" value="4" min="2" max="15" step="0.1"></label>
    <label>אורך (מ'): <input type="number" id="length" value="5" min="2" max="15" step="0.1"></label>
    <label>גובה (מ'): <input type="number" id="height" value="2.6" min="2" max="4" step="0.1"></label>
  </div>
</div>

<div class="room-container">
  <div class="catalog">
    <h3>רהיטים (לחץ להוספה)</h3>
    <div class="catalog-grid">
      <div class="item" data-name="ספה" data-w="2.2" data-d="0.9" data-h="0.85" data-link="https://example.com/sofa">
        <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=300&h=200&fit=crop" alt="ספה">
        <p>ספה</p>
        <small>220×90×85</small>
      </div>
      <div class="item" data-name="שולחן קפה" data-w="1.0" data-d="0.6" data-h="0.4" data-link="https://example.com/table">
        <img src="https://images.unsplash.com/photo-1533090481720-856c6e3c1fdc?w=300&h=200&fit=crop" alt="שולחן">
        <p>שולחן קפה</p>
        <small>100×60×40</small>
      </div>
      <div class="item" data-name="כיסא" data-w="0.5" data-d="0.5" data-h="0.9" data-link="https://example.com/chair">
        <img src="https://images.unsplash.com/photo-1506439773649-6e0eb8cfb237?w=300&h=200&fit=crop" alt="כיסא">
        <p>כיסא</p>
        <small>50×50×90</small>
      </div>
      <div class="item" data-name="מדף" data-w="1.2" data-d="0.3" data-h="0.4" data-link="https://example.com/shelf">
        <img src="https://images.unsplash.com/photo-1594620302200-9a762244a156?w=300&h=200&fit=crop" alt="מדף">
        <p>מדף</p>
        <small>120×30×40</small>
      </div>
    </div>
  </div>

  <div class="room" id="room">
    <div class="dimensions" id="dimLabel">חדר: 4×5×2.6 מטר</div>
    <div class="warning" id="warning">הרהיט לא נכנס לחדר!</div>
  </div>

  <button class="view3d-btn" onclick="alert('תלת-מימד יתווסף בהמשך')">צפה בתלת-מימד</button>
</div>

<script>
const room = document.getElementById('room');
const widthInput = document.getElementById('width');
const lengthInput = document.getElementById('length');
const heightInput = document.getElementById('height');
const dimLabel = document.getElementById('dimLabel');
const warning = document.getElementById('warning');

function updateDimensions() {
  dimLabel.textContent = `חדר: ${widthInput.value}×${lengthInput.value}×${heightInput.value} מטר`;
}
[widthInput, lengthInput, heightInput].forEach(el => el.addEventListener('input', updateDimensions));

document.querySelectorAll('.item').forEach(item => {
  item.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();

    const roomW = parseFloat(widthInput.value);
    const roomL = parseFloat(lengthInput.value);
    const roomH = parseFloat(heightInput.value);

    const itemW = parseFloat(this.dataset.w);
    const itemD = parseFloat(this.dataset.d);
    const itemH = parseFloat(this.dataset.h);

    if (itemW > roomW || itemD > roomL || itemH > roomH) {
      warning.style.display = 'block';
      setTimeout(() => warning.style.display = 'none', 2000);
      return;
    }

    const name = this.dataset.name;
    const link = this.dataset.link;
    const imgSrc = this.querySelector('img').src;

    const furniture = document.createElement('div');
    furniture.className = 'furniture';
    furniture.style.left = '40px';
    furniture.style.top = '100px';
    furniture.innerHTML = `
      <img src="${imgSrc}">
      <div class="label">${name}<br>${(itemW*100).toFixed(0)}×${(itemD*100).toFixed(0)}×${(itemH*100).toFixed(0)} ס"מ</div>
    `;

    room.appendChild(furniture);

    // Scroll to room so user
